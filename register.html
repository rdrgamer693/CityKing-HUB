<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CityKing Hub — Register</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <!-- Loading Screen -->
  <div class="loading-screen">
    <div class="loader"></div>
    <p>Loading CityKing Hub</p>
  </div>

  <!-- Navbar -->
  <nav class="navbar scrolled">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <i class="fas fa-crown"></i>
        <span>CityKing Hub</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="minecraft.html">Minecraft</a>
        <a href="news.html">News</a>
        <a href="security.html">Security</a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Toggle theme">
          <i class="fas fa-sun"></i>
        </button>
        <button class="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Register Form -->
  <section class="form-page">
    <div class="hero-glow hero-glow-1"></div>
    <div class="hero-glow hero-glow-2"></div>
    <div class="form-container">
      <div class="form-card glass-card">
        <div class="form-header">
          <div class="form-icon">
            <i class="fas fa-user-plus"></i>
          </div>
          <h2>Create Account</h2>
          <p>Join the CityKing community today</p>
        </div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <input type="text" id="username" placeholder="Choose a username" autocomplete="username" />
              <i class="fas fa-user"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <input type="email" id="email" placeholder="Enter your email" autocomplete="email" />
              <i class="fas fa-envelope"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <input type="password" id="password" placeholder="Create a password" autocomplete="new-password" />
              <i class="fas fa-key"></i>
              <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="password-strength">
              <div class="strength-bars">
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
              </div>
              <span class="strength-text"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <input type="password" id="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" />
              <i class="fas fa-lock"></i>
              <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-options" style="justify-content: flex-start;">
            <label class="checkbox-wrapper">
              <input type="checkbox" id="terms" />
              <span class="checkmark"><i class="fas fa-check"></i></span>
              <span>I agree to the <a href="#" style="color:var(--neon-blue);">Terms &amp; Conditions</a></span>
            </label>
          </div>

          <button type="submit" class="form-submit">
            <i class="fas fa-user-plus"></i> Create Account
          </button>
        </form>

        <div class="form-divider"><span>or continue with</span></div>

        <div class="social-login">
          <button aria-label="Google"><i class="fab fa-google"></i></button>
          <button aria-label="Discord"><i class="fab fa-discord"></i></button>
          <button aria-label="GitHub"><i class="fab fa-github"></i></button>
        </div>

        <div class="form-footer">
          Already have an account? <a href="login.html">Sign In</a>
        </div>
      </div>
    </div>
  </section>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initPasswordToggles();

      const passwordInput = document.getElementById('password');
      passwordInput.addEventListener('input', () => {
        updateStrengthUI(passwordInput.value);
      });

      const form = document.getElementById('registerForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        let valid = true;

        const username = document.getElementById('username');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirm = document.getElementById('confirmPassword');
        const terms = document.getElementById('terms');

        [username, email, password, confirm].forEach(clearValidation);

        if (!username.value.trim()) {
          showValidation(username, 'Username is required', true);
          valid = false;
        } else if (username.value.trim().length < 3) {
          showValidation(username, 'Username must be at least 3 characters', true);
          valid = false;
        } else {
          showValidation(username, 'Great username!', false);
        }

        if (!email.value.trim()) {
          showValidation(email, 'Email is required', true);
          valid = false;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
          showValidation(email, 'Please enter a valid email', true);
          valid = false;
        } else {
          showValidation(email, 'Looks good!', false);
        }

        if (!password.value) {
          showValidation(password, 'Password is required', true);
          valid = false;
        } else if (password.value.length < 8) {
          showValidation(password, 'Password must be at least 8 characters', true);
          valid = false;
        } else {
          showValidation(password, 'Strong password!', false);
        }

        if (!confirm.value) {
          showValidation(confirm, 'Please confirm your password', true);
          valid = false;
        } else if (confirm.value !== password.value) {
          showValidation(confirm, 'Passwords do not match', true);
          valid = false;
        } else {
          showValidation(confirm, 'Passwords match!', false);
        }

        if (!terms.checked) {
          showToast('Please accept the Terms & Conditions', 'error');
          valid = false;
        }

        if (valid) {
          showToast('Account created successfully! Redirecting…', 'success');
          setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        }
      });
    });
  </script>
</body>
</html>
