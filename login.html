<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CityKing Hub — Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <!-- Loading Screen -->
  <div class="loading-screen">
    <div class="loader"></div>
    <p>Loading CityKing Hub</p>
  </div>

  <!-- Navbar -->
  <nav class="navbar scrolled">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <i class="fas fa-crown"></i>
        <span>CityKing Hub</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="minecraft.html">Minecraft</a>
        <a href="news.html">News</a>
        <a href="security.html">Security</a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Toggle theme">
          <i class="fas fa-sun"></i>
        </button>
        <button class="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Login Form -->
  <section class="form-page">
    <div class="hero-glow hero-glow-1"></div>
    <div class="hero-glow hero-glow-2"></div>
    <div class="form-container">
      <div class="form-card glass-card">
        <div class="form-header">
          <div class="form-icon">
            <i class="fas fa-lock"></i>
          </div>
          <h2>Welcome Back</h2>
          <p>Sign in to your CityKing account</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <input type="email" id="email" placeholder="Enter your email" autocomplete="email" />
              <i class="fas fa-envelope"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
              <i class="fas fa-key"></i>
              <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-wrapper">
              <input type="checkbox" id="remember" />
              <span class="checkmark"><i class="fas fa-check"></i></span>
              <span>Remember me</span>
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="form-submit">
            <i class="fas fa-sign-in-alt"></i> Sign In
          </button>
        </form>

        <div class="form-divider"><span>or continue with</span></div>

        <div class="social-login">
          <button aria-label="Google"><i class="fab fa-google"></i></button>
          <button aria-label="Discord"><i class="fab fa-discord"></i></button>
          <button aria-label="GitHub"><i class="fab fa-github"></i></button>
        </div>

        <div class="form-footer">
          Don't have an account? <a href="register.html">Sign Up</a>
        </div>
      </div>
    </div>
  </section>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initPasswordToggles();

      const form = document.getElementById('loginForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        let valid = true;
        const email = document.getElementById('email');
        const password = document.getElementById('password');

        clearValidation(email);
        clearValidation(password);

        if (!email.value.trim()) {
          showValidation(email, 'Email is required', true);
          valid = false;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
          showValidation(email, 'Please enter a valid email', true);
          valid = false;
        } else {
          showValidation(email, 'Looks good!', false);
        }

        if (!password.value) {
          showValidation(password, 'Password is required', true);
          valid = false;
        } else if (password.value.length < 6) {
          showValidation(password, 'Password must be at least 6 characters', true);
          valid = false;
        } else {
          showValidation(password, 'Looks good!', false);
        }

        if (valid) {
          showToast('Login successful! Redirecting…', 'success');
          setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        }
      });
    });
  </script>
</body>
</html>
